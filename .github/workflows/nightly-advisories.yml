name: Nightly — advisories

# The per-push CI deny gate checks the deterministic parts (bans + licenses +
# sources). Advisories are a moving target — new RUSTSEC entries land for
# transitive deps constantly — so they run here on a schedule rather than
# blocking every push (and to avoid the temptation to blindly suppress real CVEs
# just to keep a PR green).
#
# `--all-features` so feature-gated deps are covered — notably wasmtime, which is
# behind ndn-compute's off-by-default `wasm-exec` feature and in ndn-strategy-wasm
# (a native wasmtime host). Reviewed/triaged advisories are tracked with rationale
# in deny.toml's [advisories].ignore; a RED run here means a NEW advisory landed
# and needs a look (bump the dep, or add a documented ignore).

on:
  schedule:
    - cron: "27 6 * * *" # 06:27 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-advisories
  cancel-in-progress: true

defaults:
  run:
    working-directory: ndn-ext

jobs:
  advisories:
    name: cargo-deny advisories (--all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 445736a2dd8597be0e09b36a31abd15b21e673e3, path: ndn-rs }
      # pinned sibling; bump deliberately when adopting newer ndn-radio-drivers (see workspace STATE.md)
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: 66e9097f98beaee5b0bf4d6c4dd371e78bdf0a99, path: ndn-radio-drivers }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check advisories (--all-features)
        run: cargo deny --all-features check advisories
