name: CI — ndn-ext

# PR gate mirroring the ndn-rs A+ lane (fmt+clippy, nextest, rustdoc-deny, MSRV,
# wasm, python, cargo-deny).
#
# ndn-ext depends on ndn-rs via `../` path deps, and ndn-pipes dev-deps ndn-sim,
# so the build jobs check both out as siblings. When the repos are released,
# switch those path deps to { git, tag } and drop the sibling checkouts.
#
# Toolchain: rust-toolchain.toml (in ndn-ext/) pins 1.96 + the wasm target;
# rustup auto-installs it (the MSRV job overrides). Host compile jobs run the
# default-members set; the wasm/python crates have their own jobs below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ndn-ext

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - name: Install system dependencies (dbus / libusb / libpcap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libusb-1.0-0-dev libpcap-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scope fmt to ndn-ext's own members: `cargo fmt --all` also formats the
      # sibling path deps, which are not this repo's responsibility.
      - name: rustfmt (ndn-ext members)
        run: |
          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo fmt $PKGS -- --check
      - name: clippy (default-members, all targets)
        run: cargo clippy --all-targets

  test:
    name: tests (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - name: Install system dependencies (dbus / libusb / libpcap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libusb-1.0-0-dev libpcap-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: nextest (unit + integration)
        run: cargo nextest run --profile ci
      # ndn-pipes' teardown tests are gated on the off-by-default `engine`
      # feature (they need the PathControl adapter); the default run skips them.
      - name: nextest (engine-gated pipe teardown tests)
        run: cargo nextest run --profile ci -p ndn-pipes --features engine
      - name: doctests (nextest does not run these)
        run: cargo test --doc

  docs:
    name: rustdoc (broken links are errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - name: Install system dependencies (dbus / libusb / libpcap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libusb-1.0-0-dev libpcap-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - name: Install system dependencies (dbus / libusb / libpcap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libusb-1.0-0-dev libpcap-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on rust-version
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "MSRV from Cargo.toml: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check

  wasm32:
    name: wasm32 (browser + binding crates)
    runs-on: ubuntu-latest
    env:
      # Compile-check only — don't let -Dwarnings on the wasm path-dep siblings
      # (e.g. an unused import in an ndn-face-* crate) fail the target build.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ndn-strategy-wasm is NOT a browser crate — it's a native host that *runs*
      # wasm strategies via wasmtime (which can't compile to wasm32). It's covered
      # by the native nextest/clippy jobs; excluded here on purpose.
      - name: check wasm crates
        run: |
          for p in ndn-wasm ndn-web-attach ndn-face-webtransport-wasm ndn-face-shared-worker ndn-face-webble; do
            cargo check -p "$p" --target wasm32-unknown-unknown
          done

  python:
    name: Python bindings (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-ext
          shared-key: python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install maturin
        run: pip install maturin
      - name: Lint + build wheel
        run: |
          cargo clippy -p ndn-python --all-targets
          maturin build -m crates/bindings/ndn-python/Cargo.toml

  deny:
    name: cargo-deny (advisories + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-ext }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: main, path: ndn-rs }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: main, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-sim", ref: main, path: ndn-sim }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The blocking gate checks the deterministic parts. Advisories are a
      # moving target (new RUSTSEC entries land for transitive deps constantly),
      # so they belong in a scheduled/nightly job, not the per-push gate — and
      # gating on them tempts blindly suppressing real CVEs. Known advisories are
      # tracked (with rationale) in deny.toml's [advisories].ignore.
      - name: cargo deny check (bans + licenses + sources)
        run: cargo deny check bans licenses sources
