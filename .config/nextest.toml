# cargo-nextest configuration. Profiles:
#   default — local dev: fast feedback, fail fast
#   ci      — the PR gate: run everything, retry once (network/timer tests),
#             archive junit for the run summary

[profile.default]
fail-fast = true

[profile.default.slow-timeout]
period = "60s"
terminate-after = 3

[profile.ci]
fail-fast = false
# One retry absorbs scheduler jitter in the network/timer-sensitive tests
# without hiding a real regression (a test that passes only on retry is
# reported as FLAKY in the run summary).
retries = 1

[profile.ci.slow-timeout]
period = "120s"
terminate-after = 2

[profile.ci.junit]
path = "junit.xml"
