[package]
name = "ndn-link"
description = "QUIC links between devices of personal namespaces for ndn-rs: admission and serving policy, relays and failover, link modes, held Interests and wakes, direct paths by peer entry and by membership"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-face-quic = { path = "../ndn-face-quic" }
ndn-face-local = { workspace = true }
ndn-transport = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-tlv       = { workspace = true }
ndn-security  = { workspace = true }
ndn-cert      = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
tokio-util    = { workspace = true }
parking_lot   = "0.12"
# Punch sessions are random.
getrandom     = { workspace = true }
# The value a punch's memberships are bound to.
sha2          = { workspace = true }
# What the library reports or refuses in words: `LinkDetail`, `link_code`.
ndn-mgmt-wire = { workspace = true }
# `EngineFaces`: the FaceSink over an ndn-rs forwarder engine; a namespace
# in transit has its sync group carried as the trust-context library
# carries a held one's.
ndn-engine    = { workspace = true, optional = true }
ndn-namespace = { workspace = true, optional = true }
# `LinkHints`: a data-layer device's link hint and dial over these links
# (ndn-rs invite.md, the introductions of `ndn-invite`); `ndn-heap` names the
# `Timestamp` and `NextStep` of its API.
ndn-invite    = { workspace = true, optional = true }
ndn-heap      = { workspace = true, optional = true }
# `DeviceMemory`: the link memory over a data-layer node's `DataStore`
# (`ndn_sync::DataStore`, `StoreOp`).
ndn-sync      = { workspace = true, optional = true }
# The one definition of the fault profile, shared with ndn-sim (feature `fault-injection`).
ndn-faults    = { workspace = true, optional = true }

[features]
engine = ["dep:ndn-engine", "dep:ndn-namespace"]
introductions = ["dep:ndn-invite", "dep:ndn-heap", "dep:ndn-sync"]
# The test-only fault layer (ndn-rs ndn-link.md §17B): the seeded profile of the
# conformance's `--faulty` runs on a real link's face. NEVER enable in a shipped
# binary; `tools/check-shipped-features.sh` fails when one does.
fault-injection = ["dep:ndn-faults"]

# Interface addresses for direct-path host candidates.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "freebsd"))'.dependencies]
nix = { version = "0.29", default-features = false, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# tests/direct.rs: devices on real forwarders (`EngineFaces`); tests/introductions.rs:
# real data-layer devices on them, joining by a code's link hint.
ndn-link   = { path = ".", features = ["engine", "introductions"] }
ndn-engine = { workspace = true }
# examples/ladder.rs: the old data layer (`LADDER_LAYER=old`) until stage 9.
ndn-data   = { workspace = true }
ndn-heap   = { workspace = true }
ndn-invite = { workspace = true }
ndn-app    = { workspace = true }
ndn-sync   = { workspace = true, features = ["store-fjall"] }
# tests/common: the test host's `#[async_trait]` impls.
async-trait = { workspace = true }
ndn-namespace = { workspace = true }
ndn-trust-envelope = { workspace = true }
# tests/joiner.rs: a host adopts another writer's namespace by name through its engine.
ndn-identity = { path = "../../../../ndn-rs/crates/security/ndn-identity" }
# tests/common: `NDN_LINK_TEST_LOG=<file> RUST_LOG=…` writes the tracing of a run to a file.
tracing-subscriber = { workspace = true }
# examples/ladder.rs, the latency ladder from TCP to the data layer's put->watch (round 12):
# raw QUIC on the stack the link uses, and `ndn_sync::store::BackendStore` over
# fjall (`ndn-sync` above) as the data layer's disk store.
quinn   = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls"] }
rustls  = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = { workspace = true }

[lints]
workspace = true
