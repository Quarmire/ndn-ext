[package]
name = "ndn-link"
description = "QUIC links between devices of personal namespaces for ndn-rs: admission and serving policy, relays and failover, link modes, held Interests and wakes, direct paths by peer entry and by membership"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-face-quic = { path = "../ndn-face-quic" }
ndn-face-local = { workspace = true }
ndn-transport = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-tlv       = { workspace = true }
ndn-security  = { workspace = true }
ndn-cert      = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
tokio-util    = { workspace = true }
parking_lot   = "0.12"
# Punch sessions are random.
getrandom     = { workspace = true }
# `EngineFaces`: the FaceSink over an ndn-rs forwarder engine.
ndn-engine    = { workspace = true, optional = true }
ndn-mgmt-wire = { workspace = true, optional = true }

[features]
engine = ["dep:ndn-engine", "dep:ndn-mgmt-wire"]

# Interface addresses for direct-path host candidates.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "freebsd"))'.dependencies]
nix = { version = "0.29", default-features = false, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
sha2  = { workspace = true }
# tests/direct.rs: devices on real forwarders (`EngineFaces`).
ndn-link   = { path = ".", features = ["engine"] }
ndn-engine = { workspace = true }

[lints]
workspace = true
