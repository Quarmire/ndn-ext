[package]
name = "ndn-face-quic"
description = "QUIC links for ndn-rs: NDNLPv2 over QUIC datagrams, mutual TLS 1.3 with the devices' NDN keys as raw public keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-transport = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-security  = { workspace = true }
ndn-tlv       = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
sha2          = { workspace = true }
# quinn (raw QUIC) + rustls 0.23 on the ring provider — the same crypto stack
# ndn-rs already uses, so no new crypto backend. rustls 0.23 carries RFC 7250
# raw public keys, which is what lets the TLS identity be the NDN key itself.
quinn         = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls"] }
# The datagram send buffer's accounting is the library's (`side::DATAGRAM_RECORD`): 0.11.19 keeps
# a record's 32 octets in reserve and counts them for each queued datagram (0.11.16 counted
# payload only). The floor is the release the accounting was read from, so a resolution cannot
# pick the older one; the test `the_send_buffer_counts_as_the_queued_octets_read_assumes` fails
# first if a later release counts otherwise. Nothing is used from the crate itself.
quinn-proto   = { version = "0.11.19", default-features = false }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The receive and send buffers of the link socket (`LinkEndpoint::from_socket`): quinn sets neither.
socket2       = "0.6"
# The stateless-reset key (an HMAC key quinn takes as `ring::hmac::Key`).
ring          = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["full"] }
# examples/carrier_bench.rs: a self-signed certificate for the raw quinn pair it measures, and
# `libc` for the Linux-only sampling profile (per-thread CPU timers) and the UDP_GRO switch.
rcgen    = { workspace = true }
libc     = { workspace = true }
# examples/chan_ping.rs: two data-layer nodes (`ndn-heap`) on one forwarder (`ndn-engine`, `ndn-app`,
# `ndn-namespace`) with a MemoryStore (`ndn-sync`), their channel frames over one link.
# examples/chan_relay.rs and tests/chan_relay.rs: the same nodes on forwarders of their own, a relay
# between them, every hop a link.
ndn-heap      = { workspace = true }
ndn-engine    = { workspace = true }
ndn-app       = { workspace = true }
ndn-namespace = { workspace = true }
ndn-sync      = { workspace = true }
tokio-util    = { workspace = true }

[[example]]
name = "carrier_bench"

[[example]]
name = "side_ping"

[[example]]
name = "link_rss"

[[example]]
name = "chan_ping"

[[example]]
name = "chan_relay"

[lints]
workspace = true
