[package]
name = "ndn-face-quic"
description = "QUIC links for ndn-rs: NDNLPv2 over QUIC datagrams, mutual TLS 1.3 with the devices' NDN keys as raw public keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-transport = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-security  = { workspace = true }
ndn-tlv       = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
sha2          = { workspace = true }
# quinn (raw QUIC) + rustls 0.23 on the ring provider — the same crypto stack
# ndn-rs already uses, so no new crypto backend. rustls 0.23 carries RFC 7250
# raw public keys, which is what lets the TLS identity be the NDN key itself.
quinn         = { version = "0.11", default-features = false, features = ["ring", "runtime-tokio", "rustls"] }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The stateless-reset key (an HMAC key quinn takes as `ring::hmac::Key`).
ring          = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["full"] }

[lints]
workspace = true
