[package]
name = "ndn-nan"
description = "Desktop driver for userspace Wi-Fi Aware (NAN) — wires the sans-I/O ndn-nan-core engine to a FrameIo monitor radio + tokio and presents the ndn-face-wifi-aware NanBackend (publish/subscribe discovery + connectionless follow-up coordination)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-nan-core        = { workspace = true }
ndn-frame-io        = { workspace = true }
# The bearer-agnostic radio contract — for RadioKnobs, so any radio's control
# plane can drive the engine's channel without this driver knowing the device.
ndn-radio-hal       = { workspace = true }
# The shared disciplined hardware clock (RadioHwClock) + LinkStamp live here; the
# nan runtime is one consumer of it, not its owner (see hardware-tsf-common-view).
ndn-time            = { workspace = true }
ndn-face-wifi-aware = { workspace = true }
ndn-transport      = { workspace = true }
# The NDI is a TAP netdev: raw ioctls, no crate wraps this the way we need.
libc         = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
tracing      = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true, features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
