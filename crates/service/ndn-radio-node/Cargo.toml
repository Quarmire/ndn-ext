[package]
name = "ndn-radio-node"
description = "A named-data radio node with NDN-native observability — runs the cognitive control plane and serves its OpenTelemetry span tree as Interest-able Data"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[[bin]]
name = "ndn-radio-node"
path = "src/main.rs"

[features]
# Bind a real userspace USB Wi-Fi backend (RTL8822E) as the node's radio, so the
# control plane ACTs + SENSEs on-air instead of via the no-op actuator.
libusb-backend = ["ndn-face-monitor-wifi/libusb-backend"]
# Bind an ESP32-C5 (serial-bridge, native USB-Serial-JTAG) as the node's radio face — see the c5_relay example.
bw16 = ["ndn-face-monitor-wifi/bw16"]

# The C5 relay example needs the serial backend (Esp32SerialBackend), so gate it on the bw16 feature.
[[example]]
name = "c5_relay"
required-features = ["bw16"]

[dependencies]
ndn-engine          = { workspace = true }
ndn-face-local      = { workspace = true }
ndn-face-monitor-wifi = { workspace = true }
ndn-radio-cognition = { workspace = true }
ndn-observability   = { workspace = true, features = ["layer"] }
ndn-packet          = { workspace = true }
ndn-transport       = { workspace = true }
ndn-signals-core    = { workspace = true }
ndn-security        = { workspace = true }
bytes               = { workspace = true, features = ["std"] }
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-util          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
# For the cross-node stitch proof: build a minimal LP wire to run on_egress/on_ingress.
ndn-tlv = { workspace = true, features = ["std"] }

[lints]
workspace = true
