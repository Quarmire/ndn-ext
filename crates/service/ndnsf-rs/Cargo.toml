[package]
name = "ndnsf-rs"
description = "Faithful NDN Service Framework (NDNSF) compat: four-phase service RPC over SVS, on the ndn-rs substrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
## The over-SVS four-phase driver (ServiceProvider/ServiceUser loops over
## ndn-sync's SvsPubSub) + KP-ABE access control (NAC-sealed payloads). Off by
## default so the sans-IO core (tokens, messages, flow) stays light.
driver = ["dep:ndn-sync", "dep:ndn-nacabe", "dep:ndn-security", "dep:ndn-foundation-types", "dep:tokio", "dep:serde", "dep:toml", "dep:ndn-service-core", "dep:async-trait", "dep:ndn-ratelimit"]
## Bind an `SvsPubSub` group (and thus `NdnsfCarrier`) to a real `ndn-engine`
## forwarder/face instead of raw channels — `over_face` / `NdnsfCarrier::over_face`.
## Off by default so the driver stays engine-agnostic (raw-channel core).
engine = ["driver", "dep:ndn-app", "dep:ndn-engine", "dep:ndn-strategy", "dep:tokio-util"]

[dependencies]
portable-atomic = { workspace = true }
ndn-packet = { workspace = true, features = ["std"] }
ndn-sync   = { workspace = true, optional = true }
# KP-ABE access control for the four-phase payloads (NSF-A3): NAC-seal under
# service attributes so only a holder of a satisfying ServiceController-issued
# key can read them.
ndn-nacabe = { workspace = true, optional = true }
ndn-security = { workspace = true, optional = true, features = ["abe"] }
ndn-foundation-types = { workspace = true, optional = true, features = ["std"] }
# The transport-independent service seam (Carrier/Dispatch/Frame) this crate
# provides the NdnsfCarrier for (§12).
ndn-service-core = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# Per-requester admission control (token bucket) on the four-phase request path.
ndn-ratelimit = { workspace = true, optional = true }
# `engine` feature: bind the SVS group to a real forwarder/face (over_face).
ndn-app      = { workspace = true, optional = true }
ndn-engine   = { workspace = true, optional = true }
ndn-strategy = { workspace = true, optional = true }
tokio-util   = { workspace = true, optional = true }
# ACK-collection window for the selection strategies.
tokio      = { workspace = true, optional = true, features = ["time", "rt"] }
# Policy-file model (ServiceController access policy → KP-ABE grants).
serde      = { workspace = true, optional = true, features = ["derive"] }
toml       = { version = "0.8", optional = true }
ndn-tlv    = { workspace = true, features = ["std"] }
bytes      = { workspace = true, features = ["std"] }
# Compact-SELECTION token-proof hashes (upstream computeSelectionProviderTokenProofHash).
sha2       = { workspace = true }
rand_core  = { version = "0.6", default-features = false, features = ["getrandom"] }
thiserror  = { workspace = true }
# Per-phase latency tracing; spans flow into ndn-observability's OTLP-over-NDN.
tracing    = { workspace = true }

[dev-dependencies]
# Two-node SVS convergence witness for the driver.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# Real X25519 recipient keys for the policy/issuance witnesses.
ndn-sealed-box = { workspace = true }
# #[ndn_service] macro: prove a generated service runs over NdnsfCarrier + select.
ndn-service-macro = { workspace = true }
# Weather example: the same service definition over the Tier-0 carrier too.
ndn-rpc = { workspace = true }

# `cargo run -p ndnsf-rs --example weather --features driver`
[[example]]
name = "weather"
required-features = ["driver"]

[lints]
workspace = true
