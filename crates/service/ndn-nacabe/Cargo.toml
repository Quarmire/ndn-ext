[package]
name = "ndn-nacabe"
description = "NAC protocol over ndn-rs: content-key indirection + attribute-authority key distribution (CP/KP-ABE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
## The over-NDN service surface: the attribute authority serving PUBPARAMS +
## DKEY over an ndn-app Producer, and the consumer-side ParamFetcher. Off by
## default so the sans-IO CK-data + issuance core stays light for embedded/wasm
## consumers that only need the crypto.
service = ["dep:ndn-app"]

[dependencies]
ndn-app              = { workspace = true, optional = true }
ndn-packet           = { workspace = true, features = ["std"] }
ndn-foundation-types = { workspace = true, features = ["std"] }
# ABE crypto (CP/KP/MA) + the content-key (CK) confidentiality primitive.
ndn-security         = { workspace = true, features = ["abe"] }
# Confidential DKEY delivery: seal the issued key to the requester's ephemeral
# X25519 public key (ECDH + HKDF-SHA256 + AES-256-GCM).
ndn-sealed-box       = { workspace = true }
bytes                = { workspace = true, features = ["std"] }
thiserror            = { workspace = true }
# Latency/coordination tracing. Spans flow into ndn-observability's OTLP-over-NDN
# pipeline for OpenTelemetry-style waterfalls of issuance + the over-NDN legs.
tracing              = { workspace = true }

[dev-dependencies]
# In-proc engine + faces for the end-to-end serve/fetch witness.
ndn-app       = { workspace = true }
ndn-engine    = { workspace = true }
ndn-face      = { workspace = true }
ndn-transport = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros"] }
