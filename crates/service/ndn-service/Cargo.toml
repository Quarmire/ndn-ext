[package]
name = "ndn-service"
description = "v2 service layer: authority-as-signed-Data (dynamic, versioned policy), scoped authorities (service-layer.md §4/§12)"
version.workspace = true
edition.workspace = true
license.workspace = true
# P1 compile-cost: tests/*.rs are modules of the single `suite` test binary
# (see [[test]] below), not fifteen auto-discovered binaries to link.
autotests = false

[package.metadata.scope]
classification = "extension"

[features]
## The policy→issuance bridge: gate KP-ABE key issuance on the current
## PolicyAuthority grant (`issue_decryption_key`). Off by default so the
## authority/signed-policy core stays free of the ABE crypto dependency.
issuance = ["dep:ndn-nacabe", "ndn-security/abe", "dep:ndn-foundation-types"]
## A production ProviderDirectory backed by ndn-discovery's ServiceDiscoveryProtocol
## (the Tier-1 DiscoveryCarrier's discovery seam). Off by default so the core
## stays free of the discovery machinery.
discovery = ["dep:ndn-discovery"]
## The declarative policy front-end: load a TOML policy file and reload it into a
## live PolicyAuthority (diff → grant/revoke). The imperative twin of the signed
## command front-end (always on). Off by default to keep toml/serde out of the core.
config = ["dep:toml", "dep:serde"]

[dependencies]
ndn-packet       = { workspace = true, features = ["std"] }
ndn-security     = { workspace = true }
ndn-service-core = { workspace = true }
bytes            = { workspace = true, features = ["std"] }
tracing          = { workspace = true }
# Tier-2 typed pub/sub topics (Topic<T>) over the SVS data plane.
ndn-sync         = { workspace = true }
tokio            = { workspace = true, features = ["sync"] }
# Tier-1 discovery-selection carrier (Carrier/SelectCarrier impls).
async-trait      = { workspace = true }
# Key distribution: seal a member's role-scoped keyring to its X25519 key.
ndn-sealed-box   = { workspace = true }
# HKDF-derived, scope-bound keyrings (ScopeKeyring::derive, SEC-19).
hkdf             = "0.12"
sha2             = "0.10"
# KP-ABE key authority (issue_with_policy) for the policy→issuance bridge.
ndn-nacabe       = { workspace = true, optional = true }
# KGC params hash for ABE-by-role key distribution (the `issuance` feature).
ndn-foundation-types = { workspace = true, optional = true, features = ["std"] }
# ServiceDiscoveryProtocol-backed ProviderDirectory (the `discovery` feature).
ndn-discovery    = { workspace = true, optional = true }
# Declarative policy front-end (the `config` feature).
toml             = { version = "0.8", optional = true }
serde            = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# End-to-end issuance-loop witness: master keys, content seal/open, recipient.
ndn-nacabe = { workspace = true }
ndn-foundation-types = { workspace = true, features = ["std"] }
# Discovery-carrier witness: inner Tier-0 carrier + a macro-defined service.
ndn-rpc = { workspace = true }
ndn-service-macro = { workspace = true }
# Engine-wired cross-node discovery witness (FaceId/Face for the host harness).
ndn-transport = { workspace = true }
# Leaf-seal ⇄ ContentKey interop witness: ScopeKey needs the `seal` feature.
ndn-service-core = { workspace = true, features = ["seal"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
