[package]
name = "ndn-python"
description = "PyO3 Python bindings for ndn-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[lib]
name = "ndn_rs"
# cdylib  = Python extension module (.so / .pyd)
# rlib    = allows `cargo test` without a Python install (no extension-module linking)
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Activate only when maturin/pip builds the wheel; NOT in default so
# `cargo test -p ndn-python` works without Python installed.
extension-module = ["pyo3/extension-module"]

[dependencies]
ndn-app    = { workspace = true, features = ["blocking"] }
ndn-packet = { workspace = true, features = ["std"] }
bytes      = { workspace = true, features = ["std"] }
pyo3       = { version = "0.22", features = ["macros"] }
# Service-layer scripting front-end (mode 3): the untyped ScriptDispatch seam +
# the Tier-0 carrier, driven by a small blocking runtime.
ndn-service-core = { workspace = true }
ndn-rpc          = { workspace = true }
tokio            = { workspace = true, features = ["rt"] }

[lints]
workspace = true
