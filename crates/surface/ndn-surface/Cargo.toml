[package]
name = "ndn-surface"
description = "Named, zero-copy surfaces over the SHM face — the ergonomic NamedPublisher/NamedSubscriber layer (G11)."
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[dependencies]
ndn-face-shm         = { workspace = true }
ndn-transport        = { workspace = true }
ndn-foundation-types = { workspace = true, features = ["std"] }
ndn-tlv              = { workspace = true, features = ["std"] }
ndn-packet           = { workspace = true, features = ["std"] }
ndn-app              = { workspace = true }
ndn-storage          = { workspace = true, features = ["named"] }
bytes                = { workspace = true, features = ["std"] }
sha2                 = { workspace = true }
thiserror            = { workspace = true }
# Surface storage errors (the now-fallible ndn-storage API) rather than swallowing them.
tracing              = { workspace = true }
tokio                = { workspace = true, features = ["rt", "net", "time", "macros", "sync"] }
# Only for examples/bakeoff.rs. An optional normal dep rather than a dev-dep
# because dev-dependencies cannot be optional — without the iceoryx-bakeoff
# feature, default builds and tests never compile iceoryx2.
iceoryx2 = { version = "0.9.2", optional = true }

[features]
iceoryx-bakeoff = ["dep:iceoryx2"]

[[example]]
name = "bakeoff"
required-features = ["iceoryx-bakeoff"]

[dev-dependencies]
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
ndn-engine     = { workspace = true }
ndn-face-local = { workspace = true }
ndn-security   = { workspace = true }

[lints]
workspace = true
