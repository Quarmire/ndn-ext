# cargo-deny configuration — supply-chain gate for ndn-ext.
# Run: cargo deny check        (advisories + licenses + bans + sources)
#
# ndn-ext pulls the ndn-rs crates via `../` path deps, so it inherits the same
# transitive dependency graph; this policy mirrors ndn-rs/deny.toml.

[advisories]
# Each ignore is a reviewed decision, not a blanket suppression.
ignore = [
  # rsa "Marvin Attack" — a timing side-channel in RSA *decryption*. The stack
  # uses `rsa` only for signature signing/verification; no RSA decryption oracle.
  "RUSTSEC-2023-0071",
  # bincode 1.x unmaintained. Pulled only transitively by `rabe` under the
  # optional, off-by-default `abe` feature.
  "RUSTSEC-2025-0141",
  # lru `IterMut` unsoundness — the only caller never calls `iter_mut`.
  "RUSTSEC-2026-0002",
  # rustls-pemfile unmaintained (now a thin wrapper over rustls-pki-types).
  "RUSTSEC-2025-0134",
  # quinn-proto out-of-order reassembly memory exhaustion. Reached only via
  # the optional WebTransport/QUIC face; tracked for a quinn bump. SECURITY: revisit.
  "RUSTSEC-2026-0185",
  # `Error::downcast_mut` unsoundness in a transitive dep; no exploitation path
  # in-tree. Revisit when the upstream fix lands.
  "RUSTSEC-2026-0190",
  # pyo3 0.22.6 (ndn-python bindings, only in the --all-features graph):
  # RUSTSEC-2025-0020 (Sync bound on PyCFunction::new_closure) — ndn-python uses
  # #[pyclass]/#[pymethods], never new_closure. RUSTSEC-2026-0177 (PyString::
  # from_object overflow) — not called either. Both need a PyO3 0.24 bump (breaking)
  # to clear; tracked as a follow-up. Reachability re-checked here.
  "RUSTSEC-2025-0020",
  "RUSTSEC-2026-0177",
]

[licenses]
private = { ignore = true }
allow = [
  "MIT",
  "CDLA-Permissive-2.0",
  # xdpilone (AF_XDP lib, optional afxdp face) — copyleft EU license, used as an
  # unmodified library dep. POLICY: confirm copyleft is acceptable here.
  "EUPL-1.2",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"

# unescaper is dual GPL-3.0/MIT (deprecated `/` syntax); take the MIT arm.
[[licenses.clarify]]
crate = "unescaper"
expression = "MIT"
license-files = []
